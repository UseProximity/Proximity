name: Update MCP knowledge

# Keeps the committed MCP knowledge (mcp/knowledge/) in sync with the code so
# every machine and coding agent sees the same, current picture of the repo —
# including changes from contributors who don't run the MCP locally.
#
# staging and main are protected: all changes must go through a pull request,
# and the Actions bot cannot be granted a bypass — GitHub Actions is not an
# installable app, so it is not eligible as a ruleset bypass actor. So rather
# than pushing drift straight to the branch, this opens a PR with it.
#
# The sync branch has a FIXED name, is rebuilt from the pushed commit on every
# run, and is force-pushed. Regeneration is a full rescan rather than an
# incremental patch, so that single PR always shows the total current drift —
# several pushes' worth of changes collapse into the same PR, and it can never
# fall behind its base or conflict. One PR, one merge, however many pushes fed
# it. (Pushes made with GITHUB_TOKEN do not re-trigger workflows, so this
# cannot loop.)
on:
  push:
    branches: [staging, main]
    paths:
      - "apps/web/src/**"
      - "mcp/scripts/generate-knowledge.mjs"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-knowledge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The generator uses only the Node standard library — no npm ci needed.
      - name: Regenerate knowledge
        run: node mcp/scripts/generate-knowledge.mjs

      - name: Open or update the knowledge-sync PR
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
          SYNC_BRANCH: chore/knowledge-sync-${{ github.ref_name }}
        run: |
          open_pr() {
            gh pr list --head "$SYNC_BRANCH" --base "$BASE" --state open \
              --json number --jq '.[].number' | head -1
          }

          # Nothing to sync. Tidy up a PR left open by an earlier run — someone
          # committed the regenerated knowledge themselves in the meantime.
          if git diff --quiet -- mcp/knowledge; then
            echo "Knowledge already current — nothing to sync."
            pr=$(open_pr)
            if [ -n "$pr" ]; then
              gh pr close "$pr" --delete-branch \
                --comment "Knowledge is current on \`${BASE}\` — closing."
              echo "Closed stale sync PR #${pr}."
            fi
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Rebuild the branch from the commit that triggered this run, so the PR
          # is always based on the current tip and its diff is only the drift.
          git checkout -b "$SYNC_BRANCH"
          git add mcp/knowledge
          git commit -m "chore(mcp): sync knowledge with ${GITHUB_SHA::7}"
          git push --force origin "$SYNC_BRANCH"

          # An already-open PR just picked up the new commit via the force-push.
          if [ -n "$(open_pr)" ]; then
            echo "Updated the existing knowledge-sync PR."
            exit 0
          fi

          gh pr create --base "$BASE" --head "$SYNC_BRANCH" \
            --title "chore(mcp): sync knowledge with ${BASE}" \
            --body "The committed MCP knowledge under \`mcp/knowledge/\` has drifted from the code. This PR carries the regenerated files.

          It is opened automatically and then **reused**: later pushes rebuild this branch from the tip of \`${BASE}\` and force-push, so this one PR always reflects the total current drift. Merging it once brings knowledge back in sync no matter how many pushes contributed.

          Generated by \`mcp/scripts/generate-knowledge.mjs\` — review the diff, then merge."
